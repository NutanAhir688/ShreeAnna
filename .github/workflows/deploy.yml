name: Build and Deploy ShreeAnna

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  BACKEND_IMAGE_NAME: shreeanna-api
  FRONTEND_IMAGE_NAME: shreeanna-website
  AZURE_RESOURCE_GROUP: shreeanna-rg
  AZURE_CONTAINER_APP: shreeanna

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Android Release APK
        working-directory: frontend/mobile
        env:
          SENDOTP_WIDGET_ID: ${{ secrets.SENDOTP_WIDGET_ID }}
          SENDOTP_AUTH_TOKEN: ${{ secrets.SENDOTP_AUTH_TOKEN }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
          if [ -n "$SENDOTP_WIDGET_ID" ]; then
            sed -i "s|^SENDOTP_WIDGET_ID=.*|SENDOTP_WIDGET_ID=$SENDOTP_WIDGET_ID|" .env || echo "SENDOTP_WIDGET_ID=$SENDOTP_WIDGET_ID" >> .env
          fi
          if [ -n "$SENDOTP_AUTH_TOKEN" ]; then
            sed -i "s|^SENDOTP_AUTH_TOKEN=.*|SENDOTP_AUTH_TOKEN=$SENDOTP_AUTH_TOKEN|" .env || echo "SENDOTP_AUTH_TOKEN=$SENDOTP_AUTH_TOKEN" >> .env
          fi
          if [ -n "$CARTO_API_KEY" ]; then
            sed -i "s|^CARTO_API_KEY=.*|CARTO_API_KEY=$CARTO_API_KEY|" .env || echo "CARTO_API_KEY=$CARTO_API_KEY" >> .env
          fi
          flutter pub get
          flutter build apk --release

      - name: Stage APK for Website Serving
        run: |
          mkdir -p frontend/website/public/downloads
          cp frontend/mobile/build/app/outputs/flutter-apk/app-release.apk frontend/website/public/downloads/shreeanna-mobile.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shreeanna-mobile-apk
          path: frontend/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v1.0.0"
          APK_PATH="frontend/website/public/downloads/shreeanna-mobile.apk"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Updating release asset for $RELEASE_TAG..."
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$APK_PATH" \
              --title "ShreeAnna Mobile App v1.0.0" \
              --notes "Production Release of ShreeAnna Android Mobile App for Farmers, Inspectors, and Weighbridge Operators. Built from commit ${{ github.sha }}."
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/${BACKEND_IMAGE_NAME}"
          SHA_TAG="${GITHUB_SHA}"

          docker build \
            -f backend/Dockerfile \
            -t "${IMAGE}:${SHA_TAG}" \
            -t "${IMAGE}:latest" \
            backend

          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"

      - name: Build and push frontend image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          FRONTEND_API_BASE_URL: ${{ secrets.FRONTEND_API_BASE_URL }}
        run: |
          IMAGE="docker.io/${DOCKERHUB_USERNAME}/${FRONTEND_IMAGE_NAME}"

          docker build \
            -f frontend/website/Dockerfile \
            --build-arg VITE_API_BASE_URL="${FRONTEND_API_BASE_URL}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            frontend/website

          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Configure Azure Credentials for Terraform
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "ARM_CLIENT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientId // empty')" >> $GITHUB_ENV
            echo "ARM_CLIENT_SECRET=$(echo "$AZURE_CREDENTIALS" | jq -r '.clientSecret // empty')" >> $GITHUB_ENV
            echo "ARM_SUBSCRIPTION_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.subscriptionId // empty')" >> $GITHUB_ENV
            echo "ARM_TENANT_ID=$(echo "$AZURE_CREDENTIALS" | jq -r '.tenantId // empty')" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          BACKEND_IMAGE="${DOCKERHUB_USERNAME}/${BACKEND_IMAGE_NAME}:${GITHUB_SHA}"
          FRONTEND_IMAGE="${DOCKERHUB_USERNAME}/${FRONTEND_IMAGE_NAME}:${GITHUB_SHA}"

          terraform apply -auto-approve \
            -var="backend_image=${BACKEND_IMAGE}" \
            -var="frontend_image=${FRONTEND_IMAGE}" \
            -var="enable_frontend=true" \
            -var="dockerhub_username=${DOCKERHUB_USERNAME}" \
            -var="dockerhub_token=${DOCKERHUB_TOKEN}"

      - name: Verify Terraform Deployment Outputs
        working-directory: terraform
        run: |
          echo "============================================="
          echo "Terraform Deployment Completed Successfully!"
          echo "============================================="
          terraform output
